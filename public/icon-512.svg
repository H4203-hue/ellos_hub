<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Dourado Champagne Metálico -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E0AA" />
      <stop offset="30%" stop-color="#DFBA68" />
      <stop offset="70%" stop-color="#C69230" />
      <stop offset="100%" stop-color="#8E6213" />
    </linearGradient>

    <!-- Gradiente Dourado Claro para brilho -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Sombra projetada premium -->
    <filter id="pwaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo do ícone PWA: Quadrado com bordas arredondadas Navy -->
  <rect width="512" height="512" rx="112" fill="#0F223D" />
  
  <!-- Borda Sutil Dourada Interna -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.3" />

  <!-- GRUPO DO SÍMBOLO CENTRAL -->
  <g transform="translate(106, 106) scale(3)" filter="url(#pwaShadow)">
    <!-- Círculo Pincelado / Texturizado -->
    <path d="M 55,8 
             A 47,47 0 1,1 8,58 
             C 8,30 28,10 55,8 Z" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="3.8" 
          stroke-linecap="round" 
          stroke-dasharray="280 15 20 10" />

    <path d="M 50,11 
             A 44,44 0 1,1 12,55" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="1.8" 
          stroke-opacity="0.7" />

    <!-- Elos Entrelaçados do Logo -->
    <circle cx="44" cy="55" r="16" fill="none" stroke="url(#goldGradient)" stroke-width="5.5" />
    <circle cx="66" cy="55" r="16" fill="none" stroke="url(#goldGradient)" stroke-width="5.5" />
    
    <!-- Interseção para dar o efeito entrelaçado -->
    <path d="M 50 42 A 16 16 0 0 1 60 55" fill="none" stroke="url(#goldLight)" stroke-width="5.5" stroke-linecap="round" />
  </g>
</svg>
